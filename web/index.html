<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vzor map</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="map"></canvas>

<div id="hud">
  <div class="row title">
    <span id="mapname">no raid</span>
    <span id="status" class="dim">waiting</span>
  </div>
  <div class="row dim" id="coords">-</div>
</div>

<div id="panel">
  <div class="row head">
    <strong>alignment</strong>
    <button id="toggle">hide</button>
  </div>

  <div id="body">
    <label>rotation <span id="vrot">0</span>&deg;</label>
    <input type="range" id="rot" min="-180" max="180" step="0.1" value="0">

    <label>scale <span id="vscale">1</span></label>
    <input type="range" id="scale" min="0.5" max="2" step="0.005" value="1">

    <label>offset x <span id="vox">0</span></label>
    <input type="range" id="ox" min="-400" max="400" step="0.5" value="0">

    <label>offset y <span id="voy">0</span></label>
    <input type="range" id="oy" min="-400" max="400" step="0.5" value="0">

    <div class="row">
      <label class="check"><input type="checkbox" id="fx"> flip x</label>
      <label class="check"><input type="checkbox" id="fy"> flip y</label>
    </div>

    <div class="row">
      <button id="save">save</button>
      <button id="reset">reset alignment</button>
      <button id="fit">fit</button>
      <button id="copy">copy</button>
    </div>

    <div class="dim small">
      arrows nudge 5px (shift 25), [ ] rotate, +/- scale, s save, f fit
    </div>
  </div>

  <div class="row legend small">
    <span><i style="background:#3b7bff"></i>usec</span>
    <span><i style="background:#2fd16a"></i>bear</span>
    <span><i style="background:#d6d6d6"></i>scav</span>
    <span><i style="background:#ffd23b"></i>raider</span>
    <span><i style="background:#ff3b3b"></i>boss</span>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
